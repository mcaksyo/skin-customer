<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Проверка редактора скинов</title>
</head>
<body>
    <h1>Проверка редактора скинов</h1>
    <pre id="test" role="status">Выполняется…</pre>
    <iframe src="index.html" title="Редактор" width="720" height="640"></iframe>
<script>
const frame = document.querySelector('iframe');
frame.addEventListener('load', async () => {
    const out = document.querySelector('#test');
    try {
        const check = (ok, label) => { if (!ok) throw Error(label); };
        const app = frame.contentWindow;
        const editor = app.eval('skinEditor');
        const img = document.createElement('canvas');
        img.width = img.height = 64;
        const ctx = img.getContext('2d');
        ctx.fillStyle = '#ff0000'; ctx.fillRect(0, 0, 32, 64);
        ctx.fillStyle = '#0000ff'; ctx.fillRect(32, 0, 32, 64);
        const file = await new Promise(resolve => img.toBlob(resolve));
        const event = {target: {files:[file], value:''}};
        const pix = (x,y,c=3) => editor.currentSkin.data[(y*editor.skinSize+x)*4+c];
        editor.togglePart('head_front');
        editor.togglePart('head_left');
        app.selectMode('stretch');
        await app.handleImageLoad(event);
        check(pix(11,11,0) === 255 && pix(20,11,2) === 255 && pix(27,11) === 0, 'stretch');
        app.selectSize(1024);
        check(pix(176,176,0) === 255, 'resize');
        app.selectWorkMode('cape'); app.selectSize(64);
        check(editor.currentSkin.height === 32, 'cape size');
        app.selectAllParts(); await app.loadPool(event); app.randomizePool();
        check(pix(3,3) === 255, 'pool');
        app.switchTab('preview'); app.rotatePreview();
        check(editor.previewCtx.getImageData(0,0,280,320).data.some(Boolean), 'cape preview');
        app.selectWorkMode('skin');
        check(editor.skinSize === 1024 && pix(176,176,0) === 255, 'restore skin');
        app.selectSize(64);
        await app.handleSkinLoad(event);
        check(pix(2,2,0) === 255, 'PNG load');
        app.selectMainLayer(); app.clearSelected();
        check(pix(11,11) === 0, 'clear');
        editor.wrapImage(img);
        check(Object.keys(editor.skinRegions).filter(id => !id.includes('_overlay')).every(id => {
            const [x,y] = editor.getScaledRegion(id); return pix(x,y) === 255;
        }), 'wrap');
        app.switchTab('preview');
        const original = editor.previewCanvas.toDataURL();
        app.rotatePreview();
        check(editor.previewCanvas.toDataURL() !== original, 'rotation');
        const originalClick = app.HTMLAnchorElement.prototype.click;
        app.HTMLAnchorElement.prototype.click = function () {
            check(this.download === 'minecraft_skin.png' && this.href.startsWith('data:image/png;'), 'export');
            out.dataset.download = 'yes';
        };
        try {
            app.saveSkin();
        } finally {
            app.HTMLAnchorElement.prototype.click = originalClick;
        }
        check(out.dataset.download === 'yes', 'download action');
        out.textContent = 'PASS';
    } catch (e) { out.textContent = 'FAIL: '+e.stack; }
});
</script>
</body>
</html>
